<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2316161a'/%3E%3Cpath d='M4 11.5 7 4.5l2 5 1.5-3 1.5 5' stroke='%23f5c04a' stroke-width='1.4' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>调频统计</title>
<link rel="stylesheet" href="./charts.css">
<style id="config-vars">/*__CONFIG_CSS_VARS__*/</style>
<style>
/* ---- 浏览器外壳自己的样式：只影响输入面板，不碰报表本身 ---- */
.app-input[hidden] { display: none; }
.app-input {
  max-width: 780px; margin: 48px auto; padding: 24px;
  background: #16161a; color: #e8e8ea; border: 1px solid #2c2c33; border-radius: 12px;
  font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
}
.app-input h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
.app-input p { margin: 0 0 14px; color: #9a9aa4; font-size: 13px; }
.app-input textarea {
  width: 100%; box-sizing: border-box; height: 180px; padding: 10px 12px;
  background: #0f0f12; color: #d8d8dc; border: 1px solid #2c2c33; border-radius: 8px;
  font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical;
}
.app-input .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.app-input button {
  padding: 7px 18px; border-radius: 8px; border: 1px solid #3a3a44;
  background: #26262e; color: #e8e8ea; font: inherit; cursor: pointer;
}
.app-input button:disabled { opacity: .5; cursor: default; }
.app-input .hint { color: #7d7d88; font-size: 12px; }
.app-input.drag { outline: 2px dashed #5a5a68; outline-offset: 4px; }
.app-banner {
  /*
   * 浮层，不占文档流。
   *
   * 它讲的是「这次计算有哪些非致命提示」（标签去重之类），属于运行时信息，
   * 不该把报表整体往下推 —— 一推，静态页的页面高度就和 Node 产物不一样了，
   * 而「同宽度下与产物同构」正是这个外壳要保证的事。
   */
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 50;
  max-width: min(780px, calc(100vw - 40px)); margin: 0; padding: 10px 14px; border-radius: 8px;
  font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
  white-space: pre-wrap; box-shadow: 0 6px 24px rgba(0,0,0,.45);
}
.app-banner[hidden] { display: none; }
.app-banner.error { background: #3a1d1f; color: #ffb4b4; border: 1px solid #6b2f33; }
.app-banner.warn  { background: #33301c; color: #efe0a8; border: 1px solid #6b6132; }
/* 没算出报表之前，隐藏报表骨架，避免出现一堆「—」的空壳 */
html:not([data-ready]) .screen,
html:not([data-ready]) .detail-panel { display: none; }
</style>
</head>
<body>

<!--
  浏览器外壳的输入面板。算完就 hidden，报表占满屏。
  为什么要粘贴而不做成「自动读取本地目录」：静态页没有文件系统权限，
  而页面里唯一拿得到的采集产物就是那段 JSON（fetch-in-page.js 的返回值）。
-->
<div class="app-input" id="app-input">
  <h1>把采集 JSON 粘进来</h1>
  <p>
    内容来自 <code>scripts/fetch-in-page.js</code> 的返回值（在已登录的官方页面里执行，
    它返回一个 JSON 字符串）。粘下面或把 <code>.json</code> 拖进来，全部计算与渲染都在本页完成，
    不联网、不上传。
  </p>
  <textarea id="app-json" spellcheck="false" autocomplete="off"
            placeholder='{"ok":true,"uid":"10000001","index":{...},"channels":{...}}'></textarea>
  <div class="row">
    <button id="app-go" type="button">生成报表</button>
    <label class="hint">或选文件：<input id="app-file" type="file" accept=".json,application/json"></label>
    <span class="hint">也可以直接拖 .json 进这块区域</span>
  </div>
</div>
<div class="app-banner" id="app-banner" hidden></div>

<div class="screen">

  <!-- 首屏：标题行 + KPI + 标签 + 主图 -->
  <header class="head">
    <div class="title-row">
      <span class="nick" id="nick">—</span>
      <span class="uid-pill">
        <span id="uid">UID —</span>
      </span>
      <span class="title-name" id="h1">—</span>
      <button class="eye-btn" id="eye" type="button" data-state="0" title="打码 UID" aria-label="打码 UID"></button>
      <span class="spacer"></span>
      <a class="repo-link" id="repo" target="_blank" rel="noopener">
        <svg class="repo-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span class="repo-text" id="repo-text"></span>
      </a>
    </div>
    <div class="meta-line" id="meta"></div>
  </header>

  <div class="kpi-row" id="kpi"></div>

  <div class="tag-row" id="tags"></div>

  <section class="panel chart-panel">
    <div class="panel-head">
      <span class="panel-title" data-copy="/*__COPY_CHART_TITLE__*/">抽卡总览</span>
      <div class="chart-tabs" id="chart-tabs" role="tablist"></div>
      <div class="chart-filters" id="chart-filters" role="group" aria-label="版本过滤"></div>
      <span class="panel-meta" id="chart-meta"></span>
      <button class="collapse-btn" id="collapse-chart" type="button" aria-expanded="true"
              title="折叠主图，方便把顶部信息和详情截进同一屏">
        <svg class="chev" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round" d="M4 6.5 8 10.5 12 6.5"/>
        </svg>
        <span class="collapse-text">收起</span>
      </button>
    </div>
    <div class="chart-main" id="chart-main">
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
    </div>
  </section>

</div>

<!-- 第二屏：抽卡详情 -->
<section class="panel detail-panel">
  <!--
    头部是两个**同级**栏标题 + 左栏的控件：「抽卡详情 · tab · 真实抽数 · meta」……「代理人汇总」。

    频段 tab 与「抽卡详情」同一行（用户看过上一版后要的：「还是放到跟它同行试试」）。
    #merge 也一起收进这一行：1440 下左栏扣掉内边距还有 1058，
    标题 60 + tab 332 + merge 87 放得下；800 下可用 492、需要 479+间距，收一下间距也放得下。

    **这里不再有 #detail-meta**（「41 金 · 每金 57.9 抽」）。用户原话：
    「显示真实抽数换行了，可以考虑把后面的总结全局去掉」——它是这行里最宽的一块
    （1440 实测 123px），删掉之后 800 才装得下一行。要去掉的是**总结数字本身**，
    不是换个地方显示；KPI 卡与右栏已经各有自己的口径，这里再写一遍是重复。

    左内边距 14 让标题/控件和 `.detail-list` 的内容盒起点对齐（都是 35），
    右栏标题靠自己的 12px 对齐右栏内容。两个 grid 列仍与 `.detail-body` 完全一致。

    ## 改前 vs 改后：尾巴上多了版本过滤

    改前这行的内容到「真实抽数」就结束了，想只看某个大版本只能自己数版本组。
    改后「真实抽数」右边多一个 `.detail-filter-group`（1.x / 2.x / 3.x），**只筛左栏的行**。
    右栏「代理人汇总」一行都不过滤——它是跨全部频段的全局聚合，筛了会让影画编号和抽数对不上。
    折行策略是用户拍板的 A：**同行优先，放不下才整组折到下一行、左对齐**；
    1440 / 1000 一行到底，900 及以下整组折下去（详见 charts.css 的 `.detail-filter-group`）。
  -->
  <div class="detail-head">
    <div class="detail-head-main">
      <span class="detail-title" data-copy="/*__COPY_DETAIL_TITLE__*/">抽卡详情</span>
      <div class="detail-tabs" id="detail-tabs" role="tablist"></div>
      <div class="detail-tools">
        <label class="merge-toggle">
          <input type="checkbox" id="merge">
          <span data-copy="/*__COPY_MERGE_TOGGLE__*/">真实抽数</span>
        </label>
      </div>
      <!--
        版本过滤（1.x / 2.x / 3.x），形态照抄主图那排 —— 同一套 chip 结构与图标。

        **整组当一个整体折行**：这层 `.detail-filter-group` 是 flex 的单个子项
        （`flex: 0 0 auto`，不给自己 wrap），所以窄屏放不下时整组掉到下一行、左对齐，
        而不是在 chip 中间断开。这一点靠 CSS 保证，不靠流式布局碰巧成立。

        为什么只管左栏：右栏「代理人汇总」是跨全部频段的全局聚合，
        过滤它会让影画编号和抽数对不上——那栏一行都不许筛。
      -->
      <div class="detail-filter-group" id="detail-filters" role="group" aria-label="版本筛选"></div>
    </div>
    <span class="detail-chars-title" id="detail-chars-title" data-copy="/*__COPY_DETAIL_CHARS_TITLE__*/">代理人汇总</span>
  </div>
  <div class="detail-body">
    <div class="detail-main">
      <div class="detail-list" id="detail-list"></div>
    </div>
    <aside class="detail-chars" id="detail-chars"><div class="detail-chars-fill" id="detail-chars-fill"></div></aside>
  </div>
</section>

<!--
  echarts 先以经典 script 引入：charts.js 里 `typeof echarts === 'undefined'` 会退化成
  无图表模式，所以它必须在 charts.js 之前就绪。
-->
<script src="../vendor/echarts.min.js"></script>
<!--
  charts.js **不在这里静态引入**。它是 IIFE，进来就读 window.__REPORT__；
  那时 app.js 还没算出数据，`if (!R) return` 会静默退出、页面一片空白且 console 干净。
  所以由 app.js 在赋值之后动态插入（见 app.js 的 run()）。
-->
<script type="module" src="./app.js"></script>
</body>
</html>
